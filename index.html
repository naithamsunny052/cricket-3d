<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Cricket Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
    #ui {
      position: absolute; top: 15px; left: 0; width: 100%;
      text-align: center; color: #fff; font-size: 20px; font-weight: bold;
      text-shadow: 2px 2px 4px #000; pointer-events: none;
    }
    #msg {
      position: absolute; top: 40%; width: 100%; text-align: center;
      color: yellow; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 5px #000;
      pointer-events: none;
    }
    #hit-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 18px 45px; font-size: 22px; font-weight: bold; color: #fff;
      background: #e63946; border: none; border-radius: 50px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4); cursor: pointer;
    }
    #hit-btn:active { transform: translateX(-50%) scale(0.95); background: #d62828; }
  </style>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">స్కోర్: <span id="score">0</span> | బంతులు: <span id="balls">6</span></div>
  <div id="msg"></div>
  <button id="hit-btn">HIT BAT 🏏</button>

  <script>
    let scene, camera, renderer, pitch, bat, ball;
    let score = 0, ballsLeft = 6;
    let ballActive = false;
    let ballSpeed = { x: 0, y: 0, z: 0 };
    let isSwinging = false;

    function init() {
      // 1. Scene & Camera Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3.5, 7);
      camera.lookAt(0, 1, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Light
      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(5, 10, 7);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));

      // 2. Stadium Ground & Pitch
      const groundGeo = new THREE.PlaneGeometry(100, 100);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d6a4f });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const pitchGeo = new THREE.PlaneGeometry(3.5, 30);
      const pitchMat = new THREE.MeshLambertMaterial({ color: 0xd4a373 });
      pitch = new THREE.Mesh(pitchGeo, pitchMat);
      pitch.rotation.x = -Math.PI / 2;
      pitch.position.set(0, 0.01, -10);
      scene.add(pitch);

      // Wickets
      for (let i = -0.3; i <= 0.3; i += 0.3) {
        const wicket = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.04, 1.2),
          new THREE.MeshLambertMaterial({ color: 0xffffff })
        );
        wicket.position.set(i, 0.6, 2.5);
        scene.add(wicket);
      }

      // 3. Bat
      const batGeo = new THREE.BoxGeometry(0.2, 1.4, 0.1);
      const batMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
      bat = new THREE.Mesh(batGeo, batMat);
      bat.position.set(0.6, 1.2, 2.2);
      scene.add(bat);

      // 4. Ball
      const ballGeo = new THREE.SphereGeometry(0.18, 32, 32);
      const ballMat = new THREE.MeshLambertMaterial({ color: 0xd90429 });
      ball = new THREE.Mesh(ballGeo, ballMat);
      scene.add(ball);

      resetBall();

      // Controls
      document.getElementById('hit-btn').addEventListener('click', swingBat);
      window.addEventListener('resize', onResize);

      animate();
      setTimeout(bowlBall, 1500);
    }

    function resetBall() {
      ball.position.set(0, 1.2, -22);
      ballActive = false;
      ballSpeed = { x: 0, y: 0, z: 0 };
    }

    function bowlBall() {
      if (ballsLeft <= 0) return;
      resetBall();
      ballActive = true;
      ballSpeed.z = 0.45; // Speed forward
      ballSpeed.x = (Math.random() - 0.5) * 0.04;
      document.getElementById('msg').innerText = "";
    }

    function swingBat() {
      if (isSwinging) return;
      isSwinging = true;

      // Check hit timing
      if (ballActive && ball.position.z >= 1.2 && ball.position.z <= 3.0) {
        let diff = Math.abs(ball.position.z - 2.2);
        ballActive = false;
        
        if (diff < 0.35) {
          score += 6;
          showMsg("🔥 SIXER!! 6 పరుగులు!");
          ballSpeed = { x: (Math.random() - 0.5) * 0.4, y: 0.5, z: -0.7 };
        } else {
          score += 4;
          showMsg("⚡ FOUR!! 4 పరుగులు!");
          ballSpeed = { x: (Math.random() - 0.5) * 0.5, y: 0.15, z: -0.6 };
        }
        document.getElementById('score').innerText = score;
      }

      // Bat Animation
      let swingCount = 0;
      let swingInterval = setInterval(() => {
        bat.rotation.z += 0.25;
        swingCount++;
        if (swingCount > 6) {
          clearInterval(swingInterval);
          bat.rotation.z = 0;
          isSwinging = false;
        }
      }, 30);
    }

    function showMsg(txt) {
      document.getElementById('msg').innerText = txt;
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Ball Movement Logic
      if (ballActive) {
        ball.position.z += ballSpeed.z;
        ball.position.x += ballSpeed.x;

        // Bounce
        if (ball.position.z > -10 && ball.position.z < -2) {
          ball.position.y = 0.2 + Math.abs(Math.sin((ball.position.z + 10) * 0.3)) * 1.5;
        }

        // Missed Ball
        if (ball.position.z > 4) {
          ballActive = false;
          ballsLeft--;
          document.getElementById('balls').innerText = ballsLeft;
          showMsg("DOT BALL / MISS!");
          checkGameOver();
        }
      } else if (ballSpeed.z < 0) {
        // Hit animation
        ball.position.x += ballSpeed.x;
        ball.position.y += ballSpeed.y;
        ball.position.z += ballSpeed.z;
        if (ball.position.z < -30) {
          ballsLeft--;
          document.getElementById('balls').innerText = ballsLeft;
          ballSpeed.z = 0;
          checkGameOver();
        }
      }

      renderer.render(scene, camera);
    }

    function checkGameOver() {
      if (ballsLeft > 0) {
        setTimeout(bowlBall, 1500);
      } else {
        setTimeout(() => {
          showMsg("గేమ్ ఓవర్! మొత్తం స్కోర్: " + score);
          document.getElementById('hit-btn').style.display = 'none';
        }, 1000);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
